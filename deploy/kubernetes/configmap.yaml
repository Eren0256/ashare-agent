apiVersion: v1
kind: ConfigMap
metadata:
  name: ashare-agent-config
data:
  DATABASE_AUTO_CREATE_SCHEMA: "false"
  REDIS_URL: redis://redis:6379/0
  REDIS_JOB_STREAM: ashare-agent:jobs
  REDIS_JOB_CONSUMER_GROUP: ashare-agent-workers
  REDIS_JOB_BLOCK_MS: "1000"
  REDIS_JOB_CLAIM_IDLE_MS: "300000"
  CACHE_REDIS_URL: redis://redis:6379/1
  CACHE_KEY_PREFIX: ashare-agent:cache
  CACHE_LOCK_TTL_SECONDS: "300"
  CACHE_LOCK_WAIT_TIMEOUT_SECONDS: "300"
  SECURITY_LIST_CACHE_TTL_SECONDS: "86400"
  COMPANY_BUSINESS_CACHE_TTL_SECONDS: "604800"
  FINANCIAL_REPORT_CACHE_TTL_SECONDS: "86400"
  CHART_ARTIFACT_DIR: /app/.artifacts/charts
  CHART_FONT_FAMILY: AR PL UKai CN
  LLM_TIMEOUT: "60"
  LLM_MAX_RETRIES: "2"
  APP_JWT_EXPIRE_HOURS: "12"
  CONVERSATION_CONTEXT_LIMIT: "6"
  JOB_OUTBOX_DISPATCH_INTERVAL_SECONDS: "1"
  DEMO_USERNAME: alice
  DEMO_DISPLAY_NAME: Alice
