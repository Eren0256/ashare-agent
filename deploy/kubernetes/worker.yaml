apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: runtime
    spec:
      terminationGracePeriodSeconds: 600
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-credentials
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migration
          image: ghcr.io/eren0256/ashare-agent-backend:feat-k8s-elastic-runtime
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - until alembic current 2>/dev/null | grep -q 20260819_03; do sleep 2; done
          envFrom:
            - configMapRef:
                name: ashare-agent-config
            - secretRef:
                name: ashare-agent-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: worker
          image: ghcr.io/eren0256/ashare-agent-backend:feat-k8s-elastic-runtime
          imagePullPolicy: Always
          command:
            - python
            - -m
            - ashare_agent.worker
          envFrom:
            - configMapRef:
                name: ashare-agent-config
            - secretRef:
                name: ashare-agent-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: artifacts
              mountPath: /app/.artifacts/charts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: chart-artifacts
        - name: tmp
          emptyDir: {}
